name = "general-linear-groups"
version = "0.1.0"
defaultTargets = ["GeneralLinearGroups", "GeneralLinearGroupsTests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "GeneralLinearGroups"

[[lean_lib]]
name = "GeneralLinearGroupsTests"
srcDir = "tests"
roots = ["MatrixTraceClient", "PublicAPIClient", "ElementaryClient", "ElementaryCommutatorClient", "RelativeElementaryClient", "RelativeWhiteheadClient", "ElementaryStabilizationClient", "RelativeWhiteheadConsequencesClient", "RectangularBlockUnitsClient", "DualNumberKernelsClient", "DualNumberKernelAdjointClient", "SteinbergClient", "DualNumberMixedCommutatorClient", "DualNumberMixedSLCommutatorClient", "UnitPivotDiagonalizationClient", "ElementaryPathsClient", "ElementaryDiagonalClient", "ElementaryNeighborhoodClient"]
