name = "general-linear-groups"
version = "0.1.0"
defaultTargets = ["GeneralLinearGroups", "GeneralLinearGroupsTests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e37d88a26f3791ed5a93daa1f949af1021b8d103"

[[lean_lib]]
name = "GeneralLinearGroups"

[[lean_lib]]
name = "GeneralLinearGroupsTests"
srcDir = "tests"
roots = ["MatrixTraceClient", "PublicAPIClient", "ElementaryClient", "ElementaryCommutatorClient", "RelativeElementaryClient", "RelativeWhiteheadClient", "ElementaryStabilizationClient", "RelativeWhiteheadConsequencesClient", "RectangularBlockUnitsClient", "DualNumberKernelsClient", "DualNumberKernelAdjointClient", "SteinbergClient", "DualNumberMixedCommutatorClient", "DualNumberMixedSLCommutatorClient"]
