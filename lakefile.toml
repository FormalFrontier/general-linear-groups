name = "general-linear-groups"
version = "0.1.0"
defaultTargets = ["GeneralLinearGroups", "GeneralLinearGroupsTests"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "adic-modules"
git = "https://github.com/FormalFrontier/adic-modules.git"
rev = "d0ce9c7ea73e0f995d7318e448af3e14f2e473bd"

[[lean_lib]]
name = "GeneralLinearGroups"

[[lean_lib]]
name = "GeneralLinearGroupsTests"
srcDir = "tests"
roots = ["GeneralLinearGroupsTests"]
leanOptions = { weak.linter.privateModule = false }
