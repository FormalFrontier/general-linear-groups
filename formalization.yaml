status:
  scope: >-
    Elementary-transfer author-time snapshot at 2026-09-27 06:11 UTC, not a
    live acceptance or release registry. The new elementary modules were an
    unaccepted promotion candidate from incubator revision
    38bd4b3932409b6116cc999137b52f4fd49d2f14 on the previously
    published destination base 342469a41e5d58e4aec8ac56a14ffd8ed6b79fb6.
    New-graph CI, fresh independent promotion review, Prism's acceptance,
    reviewed destination release, GitHub verification and subsequent incubator
    conversion were separate outstanding gates at that checkpoint. Later
    decisions bind their exact revisions and are not inferred from this dated
    observation. The following account is a distinct predecessor snapshot,
    not the current acceptance status of the elementary transfer.
    Author-time snapshot at 2026-09-26 05:52 UTC, not a live release registry.
    This assembly combines ordinary-readiness input
    0e157fe30daa46dfba4a3bdfb0237b66fddb61ac and metadata input
    2a0bb659e2290e8fa65a2edde741479b11b45c94, both unreviewed at this checkpoint,
    over accepted development c7b9492a6fa3fdd38f96f41a4c57e19fba9d7493.
    This unreviewed successor starts from frozen unaccepted assembly
    72999f87130605de361d04b5109ead563b7e1f64 and replaces only the
    mathematical implementation of NonUnital.positivePow with an explicit
    Nat.rec; source commit 907124e973dd20f3efdeb8de0cad42e331b9c6d8
    precedes regeneration of the source-bound native documentation.
    Subsequent decisions must bind their exact candidate and are not implied by
    this author-time observation. The assembly has thirteen mathematical leaves,
    an aggregate public root and two default-built private client modules with
    thirteen trace clients and thirty-three other API clients. The principal entries
    below summarize every leaf's subject; they are not a complete inventory
    of public, private, generated or example declarations. No first official
    release or completed release verification is claimed. Detailed source
    coverage decisions remain in source repositories.
  main_results:
    - declaration: "Matrix.GeneralLinearGroup.elementaryUnit"
      file: "GeneralLinearGroups/Elementary.lean"
      note: >-
        Off-diagonal unit 1 + single i j c over any Ring, with inverse,
        coefficient-addition product and a CommRing-only native-transvection
        comparison. It requires a finite decidable index type and i different
        from j, not a commutative coefficient ring.
    - declaration: "Matrix.GeneralLinearGroup.elementarySubgroup"
      file: "GeneralLinearGroups/Elementary.lean"
      note: >-
        Closure of elementary units, including generator and ordered-list
        product membership. It is bottom for subsingleton indices without
        implying that the entire GL group is trivial.
    - declaration: "Matrix.GeneralLinearGroup.upperUnit_mem_elementarySubgroup"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: >-
        Upper block units lie in the elementary subgroup by single-entry
        decomposition, including empty indices and noncommutative rings.
    - declaration: "Matrix.GeneralLinearGroup.lowerUnit_mem_elementarySubgroup"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "Lower block units use the negative lower-left block over any Ring."
    - declaration: "Matrix.GeneralLinearGroup.blockDiagonalUnit_mem_elementarySubgroup"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: >-
        Doubled diag(g, g⁻¹) lies in the elementary subgroup using the signed
        swap membership and the existing ordered Whitehead factorization.
    - declaration: "Matrix.GeneralLinearGroup.mapRingHom"
      file: "GeneralLinearGroups/Whitehead.lean"
      note: "Coefficient maps on finite general linear groups over arbitrary semirings."
    - declaration: "Matrix.GeneralLinearGroup.blockDiagonalUnit_eq"
      file: "GeneralLinearGroups/Whitehead.lean"
      note: "Signed four-factor decomposition of diag(g, inverse g) over arbitrary rings."
    - declaration: "Matrix.GeneralLinearGroup.mapRingHom_liftBlockDiagonal"
      file: "GeneralLinearGroups/Whitehead.lean"
      note: >-
        A surjective ring homomorphism lifts this doubled block diagonal.
        It need not induce a surjection on the original finite GL.
    - declaration: "Matrix.GeneralLinearGroup.reindexEquiv"
      file: "GeneralLinearGroups/Reindex.lean"
      note: >-
        Equivalence along a finite-index-type equivalence, with identity,
        composition, inverse and coefficient-map laws; not stabilization
        between unequal cardinalities.
    - declaration: "TwoSidedIdeal.isQuasiregular_iff_isRightQuasiregular"
      file: "GeneralLinearGroups/QuasiregularIdeal.lean"
      note: >-
        The right-quasi-inverse condition is quantified over every element
        of the two-sided ideal. A single right inverse is not asserted to
        be two-sided in an arbitrary ring.
    - declaration: "TwoSidedIdeal.ringJacobson_isGreatest_isQuasiregular"
      file: "GeneralLinearGroups/QuasiregularIdeal.lean"
      note: "The Jacobson radical is the greatest quasiregular two-sided ideal."
    - declaration: "TwoSidedIdeal.IsNil.le_ringJacobson"
      file: "GeneralLinearGroups/NilIdeal.lean"
      note: >-
        Pointwise nil ideals are quasiregular and contained in the Jacobson
        radical; no common exponent or nilpotence of the whole ideal is assumed.
    - declaration: "TwoSidedIdeal.IsQuasiregular.matrix"
      file: "GeneralLinearGroups/MatrixQuasiregular.lean"
      note: "Entrywise finite matrix ideals preserve quasiregularity, including empty indices."
    - declaration: "TwoSidedIdeal.quotientDivisionRing"
      file: "GeneralLinearGroups/LocalQuotient.lean"
      note: >-
        A proper two-sided ideal with unit complement gives a maximal left
        ideal and a native division-ring quotient; commutativity and uniqueness
        of maximal ideals are not assumed.
    - declaration: "Matrix.GeneralLinearGroup.idealGeneralLinearGroupEquivCongruence"
      file: "GeneralLinearGroups/CongruenceSubgroup.lean"
      note: >-
        The ideal-unitization augmentation kernel is equivalent to the ambient
        congruence subgroup. Ambient injectivity and multiplicative exactness
        hold for every two-sided ideal, independently of quotient surjectivity.
    - declaration: "Matrix.GeneralLinearGroup.isUnit_of_mapMatrix_quotient_isUnit"
      file: "GeneralLinearGroups/QuasiregularQuotient.lean"
      note: >-
        A specified finite square matrix is a unit if its image modulo a
        quasiregular two-sided ideal is a unit; empty indices are allowed.
    - declaration: "Matrix.GeneralLinearGroup.idealGeneralLinearGroupToRing_shortExact"
      file: "GeneralLinearGroups/QuasiregularQuotient.lean"
      note: >-
        The three injective, multiplicatively exact and surjective assertions
        hold under quasiregularity. This is not arbitrary quotient GL surjectivity.
    - declaration: "NonUnital.positivePow"
      file: "GeneralLinearGroups/NonUnitalNilpotent.lean"
      note: >-
        positivePow x k multiplies k+1 copies, without a multiplicative identity;
        NonUnital.IsNilpotent asks for such a positive power to vanish.
    - declaration: "Matrix.IsStrictlyUpperTriangular.isNilpotent"
      file: "GeneralLinearGroups/NonUnitalNilpotent.lean"
      note: >-
        Strictly upper triangular Fin n matrices over nonunital rings are
        nilpotent. The uniform n+1-copy witness includes the empty matrix.
    - declaration: "Matrix.GeneralLinearGroup.nilpotentMatrixElement"
      file: "GeneralLinearGroups/NonUnitalNilpotent.lean"
      note: >-
        A vanishing power after entrywise unitization constructs a kernel
        element with value 1+x and an explicit finite alternating geometric
        inverse. The supplied exponent may be zero only when its power equation holds.
    - declaration: "Matrix.GeneralLinearGroup.isUnit_one_add_unitizationMatrix_iff_isQuasiregular"
      file: "GeneralLinearGroups/NonUnitalQuasiregular.lean"
      note: >-
        Native nonunital quasiregularity is equivalent to invertibility of
        1+x after unitization, and to representability in the augmentation
        kernel. No coefficient commutativity or nontriviality is inserted.
    - declaration: "Unitization.ringEquivProd"
      file: "GeneralLinearGroups/UnitalComparison.lean"
      note: >-
        A unital algebra's unitization is the product of its commutative scalar
        ring and the algebra; the coefficient algebra need not be commutative.
    - declaration: "Matrix.GeneralLinearGroup.nonUnitalGeneralLinearGroupEquiv"
      file: "GeneralLinearGroups/UnitalComparison.lean"
      note: "For a unital ring, the augmentation-kernel group is the ordinary finite GL."
    - declaration: "Ring.additiveCommutators"
      file: "GeneralLinearGroups/AdditiveCommutator.lean"
      note: >-
        Native additive-subgroup closure of a*b-b*a in a unital ring.
        It is not defined as a two-sided ideal.
    - declaration: "Matrix.trace_mul_sub_trace_mul_commutators"
      file: "GeneralLinearGroups/MatrixTrace.lean"
      note: >-
        A rectangular cyclic trace difference is a finite sum of scalar
        commutators, not generally zero in a noncommutative coefficient ring.
    - declaration: "Matrix.traceOnCommutatorQuotient"
      file: "GeneralLinearGroups/MatrixTrace.lean"
      note: "Trace descends through the full additive commutator closure, even for empty indices."
    - declaration: "Matrix.traceQuotientEquiv"
      file: "GeneralLinearGroups/MatrixTrace.lean"
      note: >-
        For a chosen index p, trace is an additive equivalence with corner
        inverse r mapped to single p p r. Matrix-unit decomposition gives a
        membership criterion, inverse/representative laws and corner independence.
        No ring equivalence or empty-index inverse is asserted.

