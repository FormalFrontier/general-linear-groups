fidelity:
  divergences: >-
    Source-indexed constructions are reorganized into generic ring and finite
    matrix APIs. Semiring, ring, nonunital-ring and commutative scalar-ring
    hypotheses remain distinct. Nil means pointwise nil, not a uniform exponent
    for an ideal. Quasiregularity supplies the additional quotient lifting
    hypothesis. The trace inverse needs a chosen index although the forward
    map includes empty indices. Neither trace coefficient naturality,
    conjugation, stabilization, projective-module trace nor K0 descent is
    provided. Elementary generators and block membership need Ring only;
    singleton-index elementary closure is bottom without trivializing GL.
    Finite perfectness needs at least three indices; relative elementary
    normal closure is internal to E, and compatible coefficient maps give
    inclusions, not surjectivity. Semiring stabilization is a monoid hom on
    GL units; lower Whitehead blocks use a minus sign. Doubled relative
    conjugation permits arbitrary GL conjugators only after stabilization;
    the ordered commutator factor ends with the diagonal of (h*g)⁻¹.
    No SL=E, same-rank ambient elementary normality, original-rank
    commutator containment, stable K1, excision, stable/direct-limit GL or
    full source-coverage claim follows.

