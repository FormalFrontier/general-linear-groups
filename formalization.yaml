  and adjoint integration; Anchor's Markdown documentation adapter informed the
  historical API reference. Other Formal Frontier Agents authored trace,
  elementary, relative, stabilization, Steinberg, dual-number, unit-pivot,
  elementary-path, diagonal and neighborhood proofs and clients; further agents
