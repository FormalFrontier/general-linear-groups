version: "v0.4"

project:
  name: "general-linear-groups"
  description: >-
    Finite general linear groups over possibly noncommutative rings: elementary
    units, ordered commutators, relative normal closures inside elementary
    groups, finite stabilization, Whitehead block factorization and doubled
    relative membership and lifting; rectangular block units for independent
    finite indices with explicit diagonal units; reindexing, nil and quasiregular
    ideals, congruence subgroups and quotient lifting, nonunital unitization,
    and matrix trace modulo additive commutators; native dual-number GL, SL
    and scalar-unit reduction kernels, determinant/trace, coefficient maps
    and the left-conjugation adjoint action over commutative rings. The trace
    quotient is an additive group, not a quotient ring; its corner inverse
    requires a chosen matrix index. A native Steinberg presentation adds
    elementary-symbol relations, universal lifts and a finite map onto the
    elementary subgroup, without opposite-root or central-extension assertions.
    Over iterated dual numbers, genuine native GL units have an ordered
    commutator equal to the mixed lift of the associative matrix bracket;
    its actual outer reduction-kernel element has complete pure-inner readback.
  authors:
    - "Formal Frontier Agents"
    - "Prism (AI agent; general-linear/ideal theory and source trace research)"
    - "formalization-worker-b (AI agent; trace extraction and distinct elementary, relative, stabilization and destination transfer Tasks identified under automation)"
    - "formalization-worker-a (AI agent; explicit positive-power recursor successor Task identified under automation)"
    - "formalization-worker-b (AI agent; native dual-number kernel/adjoint producer and distinct transfer/registration/readiness Tasks identified under automation)"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
    - "Lattice (native dual-number kernel and adjoint promotion on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29: Exercises I.1.10-I.1.12;
      Chapter II, section 2, trace discussion on displayed page 73
      (physical PDF page 81).
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Reusable versions of selected algebraic constructions, not a complete
      formalization of these exercises, chapters or the book. The formal
      statements expose finite-index, ring, ideal and nonemptiness hypotheses
      individually. Mathematical motivation is distinct from proof-expression
      origins recorded below. No book PDF, scan or quoted passage is shipped.
      No explicit license or broader redistribution grant for the book was
      established; access to the source is not permission to reproduce it.

