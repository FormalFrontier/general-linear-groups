      note: "Stabilization has zero upper-right block."
    - declaration: "Matrix.GeneralLinearGroup.stabilize_apply_inr_inl"
      file: "GeneralLinearGroups/ElementaryStabilization.lean"
      note: "Stabilization has zero lower-left block."
    - declaration: "Matrix.GeneralLinearGroup.stabilize_apply_inr_inr"
