fidelity:
  divergences: >-
    The iterated-dual-number result has independent coefficient and index
    universes, CommRing and finite decidable indices, including empty and
    singleton types, zero rings and characteristic two. Its ordered full
    native-unit commutator is liftGL(innerPure (XY-YX)); epsilon's actual
    outer reduction is liftGL X, generally not 1. The resulting genuine
    outer-kernel element has complete pure-inner matrix readback. This is
    not a bracket of the abelian first-order kernel, nor an SL, scheme-point
    or global Lie theorem. No source-passage correspondence is claimed.
    Steinberg.Presented uses exactly additive, disjoint and ordered-composable
    relations over arbitrary Ring and independent universes, without finite
    indices for the presentation or an opposite-root relation. Reversed
    composable commutators use -(b*a), not -(a*b). The map onto the elementary
    subgroup and its GL-range equality require finite decidable indices.
    Rank at least three is the usual Steinberg interpretation; low ranks assert
    only the stated laws and surjection. Finite rank does not imply finite
    presentation. No kernel centrality, universal central extension, K2 or
    direct-limit theorem is claimed.
    Source-indexed constructions are reorganized into generic ring and finite
    matrix APIs. Semiring, ring, nonunital-ring and commutative scalar-ring
    hypotheses remain distinct. Nil means pointwise nil, not a uniform exponent
    for an ideal. Quasiregularity supplies the additional quotient lifting
    hypothesis. The trace inverse needs a chosen index although the forward
    map includes empty indices. Neither trace coefficient naturality,
    conjugation, stabilization, projective-module trace nor K0 descent is
    provided. Elementary generators and block membership need Ring only;
    singleton-index elementary closure is bottom without trivializing GL.
    Finite perfectness needs at least three indices; relative elementary
    normal closure is internal to E, and compatible coefficient maps give
    inclusions, not surjectivity. Semiring stabilization is a monoid hom on
    GL units; lower Whitehead blocks use a minus sign. Doubled relative
    conjugation permits arbitrary GL conjugators only after stabilization;
    the ordered commutator factor ends with the diagonal of (h*g)⁻¹.
    Rectangular upper units work over arbitrary Ring; diagonal pairs already
    work over Semiring. Independent finite indices may be empty and their
    universes may differ. Both diagonal units are explicit inputs, not
    consequences asserted from triangular invertibility. Upper unit and
    triangular factorizations preserve the B * D⁻¹ and A⁻¹ * B orders;
    the inverse off-block is -(A⁻¹ * B * D⁻¹). A hom killing E needs no
    abelian target or ambient normality assumption.
    Native dual-number reduction uses actual multiplicative GL/SL/unit kernels,
    not additive ideal kernels. The new modules require CommRing, independent
    coefficient/index universes and finite decidable indices, allowing empty
    ranks, zero rings and characteristic two. SL kernel coefficients use
    mathlib's trace-zero Lie subalgebra; determinant has a first-order trace
    square and SL includes into GL. Ring-hom coefficient maps are natural but
    not generally R-linear. Adjoint means left conjugation g * X * g⁻¹,
    including nonconstant native units; it is not GL left multiplication.
    Abelian first-order kernel group commutators do not implement the
    nonzero matrix Lie bracket. No tangent scheme, arbitrary scheme base
    change or incubator-side point bridge is promoted.
    No SL=E, same-rank ambient elementary normality, original-rank
    commutator containment, stable K1, excision, stable/direct-limit GL or
    full source-coverage claim follows.

