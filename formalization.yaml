    - declaration: "Matrix.GeneralLinearGroup.mapElementarySubgroup_relativeElementarySubgroup_le"
      file: "GeneralLinearGroups/RelativeElementary.lean"
      note: "Compatible coefficient maps carry relative elementary groups into relative elementary groups, without any surjectivity assumption."
    - declaration: "Matrix.GeneralLinearGroup.upperUnit_zero"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "The upper block unit with zero off-diagonal block is the identity."
    - declaration: "Matrix.GeneralLinearGroup.lowerUnit_zero"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "The lower block unit with zero off-diagonal block is the identity."
    - declaration: "Matrix.GeneralLinearGroup.upperUnit_add"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "Upper block units turn matrix addition into group multiplication."
    - declaration: "Matrix.GeneralLinearGroup.lowerUnit_add"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "Lower block units turn matrix addition into group multiplication."
    - declaration: "Matrix.GeneralLinearGroup.upperUnit_single"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "A single upper-block entry is an off-block elementary unit."
    - declaration: "Matrix.GeneralLinearGroup.lowerUnit_single"
      file: "GeneralLinearGroups/ElementaryWhitehead.lean"
      note: "A single lower-block entry is elementary with coefficient `-c`."
    - declaration: "Matrix.GeneralLinearGroup.upperUnit_mem_relativeElementarySubgroup"
      file: "GeneralLinearGroups/RelativeWhitehead.lean"
      note: "An ideal-valued upper block unit belongs to the doubled relative elementary subgroup; this also holds for an empty index type."
    - declaration: "Matrix.GeneralLinearGroup.lowerUnit_mem_relativeElementarySubgroup"
      file: "GeneralLinearGroups/RelativeWhitehead.lean"
      note: "An ideal-valued lower block unit belongs to the doubled relative elementary subgroup. Its lower-left block is `-a`, so its elementary generators use `-a i j`."
    - declaration: "Matrix.GeneralLinearGroup.blockDiagonalUnit_eq_five"
      file: "GeneralLinearGroups/RelativeWhitehead.lean"
      note: "The native five-factor block identity; `lowerUnit b` has lower-left block `-b`. No ideal hypothesis is needed."
    - declaration: "Matrix.GeneralLinearGroup.blockDiagonalUnit_mem_relativeElementarySubgroup"
      file: "GeneralLinearGroups/RelativeWhitehead.lean"
      note: "The Whitehead diagonal of a congruence unit is relative elementary after doubling, with conjugation only inside the existing elementary subgroup."
    - declaration: "Matrix.GeneralLinearGroup.stabilize"
      file: "GeneralLinearGroups/ElementaryStabilization.lean"
      note: "Extend an invertible matrix by an identity block, with no positivity assumption on the sizes of either block."
    - declaration: "Matrix.GeneralLinearGroup.stabilize_apply_inl_inl"
